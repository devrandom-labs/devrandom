packages:
  - apps/*
  - packages/*
  - services/*

catalogMode: strict

autoInstallPeers: false

cleanupUnusedCatalogs: true

engineStrict: true

linkWorkspacePackages: false

preferWorkspacePackages: false

pmOnFail: ignore

saveExact: true

saveWorkspaceProtocol: rolling

sharedWorkspaceLockfile: true

strictPeerDependencies: true

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@earendil-works/chord@0.87.1'
  - '@earendil-works/pi-agent-core@0.87.1'
  - '@earendil-works/pi-ai@0.87.1'
  - '@earendil-works/pi-coding-agent@0.87.1'
  - '@earendil-works/pi-telemetry@0.87.1'
  - '@earendil-works/pi-tui@0.87.1'
  - '@next/env@16.3.6'
  - '@next/swc-darwin-arm64@16.3.6'
  - '@next/swc-darwin-x64@16.3.6'
  - '@next/swc-linux-arm64-gnu@16.3.6'
  - '@next/swc-linux-arm64-musl@16.3.6'
  - '@next/swc-linux-x64-gnu@16.3.6'
  - '@next/swc-linux-x64-musl@16.3.6'
  - '@next/swc-win32-arm64-msvc@16.3.6'
  - '@next/swc-win32-x64-msvc@16.3.6'
  - ignore@7.0.10
  - next@16.3.6
  - prettier@3.9.9

minimumReleaseAgeExcludePrune: true

minimumReleaseAgeStrict: true

allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false

catalog:
  '@earendil-works/pi-ai': 0.87.1
  '@earendil-works/pi-coding-agent': 0.87.1
